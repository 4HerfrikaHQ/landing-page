<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your 4HerFrika sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background:#fff5fa;font-family:Arial,Helvetica,sans-serif;color:#03065c;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff5fa;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr>
              <td style="font-size:20px;font-weight:bold;color:#c8007a;padding-bottom:24px;">4HerFrika</td>
            </tr>
            <tr>
              <td style="font-size:22px;font-weight:bold;line-height:1.3;padding-bottom:12px;">Your sign-in code</td>
            </tr>
            <tr>
              <td style="font-size:16px;line-height:1.5;color:#4a4a68;padding-bottom:24px;">Enter this code on the 4HerFrika page you came from. It works for 10 minutes.</td>
            </tr>
            <tr>
              <td align="center" style="font-family:'Courier New',Courier,monospace;font-size:36px;font-weight:bold;letter-spacing:8px;color:#03065c;background:#fff5fa;border-radius:12px;padding:20px 0;">{{ .Token }}</td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:1.5;color:#4a4a68;padding-top:24px;">If you didn't ask for this code, you can ignore this email. Nobody can sign in without it.</td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.5;color:#6b6b85;padding-top:24px;border-top:1px solid #f3d9e8;">Questions? Email <a href="mailto:hello@4herfrika.org" style="color:#c8007a;">hello@4herfrika.org</a>.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
